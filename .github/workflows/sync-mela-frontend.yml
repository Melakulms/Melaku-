# Mela source synchronization: Supabase active frontend -> GitHub editable source
# Sync trigger marker: v37 live-stats integration fix + CI provenance fallback + fresh validation
name: Sync Mela frontend source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-mela-frontend.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: mela-frontend-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch authoritative active Mela frontend
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://duizgtmbptmlbyipreqg.supabase.co/functions/v1/mela-web'
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H 'Accept: text/html' \
            -D /tmp/mela-headers.txt \
            "$endpoint" \
            -o /tmp/mela-index.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          raw = Path('/tmp/mela-index.html').read_bytes()
          html = raw.decode('utf-8-sig', errors='replace')
          headers = Path('/tmp/mela-headers.txt').read_text(encoding='utf-8-sig', errors='replace')
          builds = re.findall(r'(?im)^x-mela-build:\s*([^\r\n]+)', headers)
          header_build = builds[-1].strip() if builds else ''
          title_match = re.search(r'(?is)<title>\s*Mela\s+v([0-9]+(?:\.[0-9]+)*)\b', html)
          title_build = f'v{title_match.group(1)}' if title_match else ''
          build = header_build or title_build

          print('MELA_CI_RESPONSE_BYTES=' + str(len(raw)))
          print('MELA_CI_RESPONSE_PREFIX=' + repr(html[:160]))
          print('MELA_CI_BUILD_HEADER=' + repr(header_build))
          print('MELA_CI_BUILD_TITLE=' + repr(title_build))
          print('MELA_CI_BUILD_EFFECTIVE=' + repr(build))

          normalized = html.lstrip()
          if not re.match(r'(?is)^(?:<!doctype\s+html\b|<html\b)', normalized):
              raise SystemExit('Live mela-web response is not an HTML document')
          if not re.search(r'(?is)<title>\s*Mela\b', html):
              raise SystemExit('Live mela-web response does not contain a Mela title')
          if not build:
              raise SystemExit('Live mela-web response has neither X-Mela-Build nor a versioned Mela title')
          Path('/tmp/mela-build.txt').write_text(build, encoding='utf-8')
          PY

          sha="$(sha256sum /tmp/mela-index.html | awk '{print $1}')"
          build="$(cat /tmp/mela-build.txt)"
          cp /tmp/mela-index.html index.html

          cat > mela.sync.json <<EOF
          {
            "source": "supabase-active-frontend",
            "supabase_project_ref": "duizgtmbptmlbyipreqg",
            "edge_function": "mela-web",
            "build": "$build",
            "sha256": "$sha",
            "production_launch": false
          }
          EOF

      - name: Commit source only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html mela.sync.json; then
            echo 'Mela frontend source already synchronized.'
            exit 0
          fi

          git config user.name 'Mela Sync Bot'
          git config user.email 'mela-sync-bot@users.noreply.github.com'
          git add index.html mela.sync.json
          build="$(python3 -c 'import json; print(json.load(open("mela.sync.json"))["build"])')"
          git commit -m "Sync active Mela frontend ${build}"
          git push
