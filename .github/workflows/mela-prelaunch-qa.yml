name: Mela pre-launch integration QA

# CI is intentionally pre-launch: production_launch remains false until the full authenticated E2E gate passes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'mela.sync.json'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'qa/**'
      - 'tests/**'
      - 'docs/**'
      - 'netlify.toml'
      - '.github/workflows/mela-prelaunch-qa.yml'

permissions:
  contents: read

env:
  # Repository variable MELA_FRONTEND_URL must point to the real HTML-serving production frontend.
  # Do not set this to a Supabase Edge Function URL.
  MELA_QA_BUILD_ENDPOINT: ${{ vars.MELA_FRONTEND_URL }}
  MELA_E2E_EMAIL: ${{ secrets.MELA_E2E_EMAIL }}
  MELA_E2E_PASSWORD: ${{ secrets.MELA_E2E_PASSWORD }}
  MELA_E2E_SERVICE_ROLE_KEY: ${{ secrets.MELA_E2E_SERVICE_ROLE_KEY }}
  MELA_SUPABASE_ANON_KEY: ${{ secrets.MELA_SUPABASE_ANON_KEY }}
  MELA_SUPABASE_URL: ${{ vars.MELA_SUPABASE_URL }}
  MELA_TEST_STUDENT_EMAIL: ${{ secrets.MELA_TEST_STUDENT_EMAIL }}
  MELA_TEST_STUDENT_PASSWORD: ${{ secrets.MELA_TEST_STUDENT_PASSWORD }}

concurrency:
  group: mela-prelaunch-qa
  cancel-in-progress: true

jobs:
  public-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund

      - name: Build source
        run: npm run build

      - name: Verify generated production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/index.html
          grep -Eiq '^<!doctype html>' dist/index.html
          grep -Eiq '<title>[[:space:]]*Mela' dist/index.html

      - name: Enforce pre-launch source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, pathlib
          html = pathlib.Path('index.html').read_text()
          sync = json.loads(pathlib.Path('mela.sync.json').read_text())
          build = sync['build']
          assert sync.get('production_launch') is False, 'production_launch must remain false'
          assert f'Mela {build} Integrated Pre-Launch Preview' in html, 'build label mismatch'
          assert html.count('id="liveMasteryChip"') == 1, 'liveMasteryChip must be unique'
          assert html.count('id="liveMasteryProgress"') == 1, 'liveMasteryProgress must be unique'
          assert "$('liveQuestions').textContent=N(d.active_questions)" not in html, 'out-of-scope live-stat formatter regression'
          assert 'const fmt=v=>Number(v||0).toLocaleString()' in html, 'live-stat formatter missing'
          assert "if($('hp'))$('hp').textContent=" not in html, 'async health must not overwrite localized hero text'
          for locale in ('am','om','ti','so'):
              assert re.search(rf'<option value="{locale}">', html), f'{locale} option missing'
          print(f'Pre-launch source invariants pass for {build}.')
          PY

      - name: Verify AI tool-call run linkage regression guard
        run: node qa/ai-tool-call-run-linkage.mjs

      - name: Verify authenticated/pre-launch QA configuration
        run: node qa/require-auth-e2e-env.mjs

      - name: Verify active production frontend contract
        run: node qa/production-contract.mjs

      - name: Verify protected workflow RPCs deny anonymous callers
        run: node qa/security-smoke.mjs

      - name: Run low-impact live backend concurrency smoke
        env:
          MELA_QA_REQUESTS: '20'
          MELA_QA_CONCURRENCY: '5'
          MELA_QA_MAX_P95_MS: '5000'
        run: npm run qa:load-smoke

      - name: Install browser matrix
        run: npx playwright install --with-deps chromium firefox webkit

      # IMPORTANT: test the actual Vite production output, not the repository source directory.
      - name: Start built production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mela-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mela-preview.log
          exit 1

      - name: Run complete desktop and mobile browser integration matrix against built output
        env:
          MELA_QA_BASE_URL: http://127.0.0.1:4173
        run: npm run qa:all

      # This is intentionally a separate gate: local preview success is not production success.
      - name: Run browser matrix against deployed production frontend
        env:
          MELA_QA_BASE_URL: ${{ vars.MELA_FRONTEND_URL }}
        run: npm run qa:all

      - name: Upload QA diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mela-prelaunch-qa-diagnostics
          path: |
            /tmp/mela-preview.log
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
