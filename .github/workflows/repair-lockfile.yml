name: Repair and verify npm lockfile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/repair-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate authoritative lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lockfile safely
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: synchronize npm lockfile'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
