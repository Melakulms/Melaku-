<!doctype html>
<html lang="en-ET">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mela</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f6fc;color:#201a31;min-height:100vh;display:grid;place-items:center}.boot{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #e5e0ed;border-radius:18px;padding:24px;box-shadow:0 12px 40px rgba(50,36,90,.08)}.mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:#6848dc;color:#fff;font-weight:900;margin-bottom:14px}.muted{color:#726b81}.error{border-left:4px solid #b3261e;padding-left:12px}
  </style>
</head>
<body>
  <main class="boot" id="boot" aria-live="polite">
    <div class="mark">M</div>
    <h1>Opening Mela…</h1>
    <p class="muted">Loading the verified active Mela frontend from the Supabase build service.</p>
  </main>
  <script>
    const MELA_BUILD_ENDPOINT = 'https://duizgtmbptmlbyipreqg.supabase.co/functions/v1/mela-web';

    async function bootMela(){
      const response = await fetch(MELA_BUILD_ENDPOINT,{cache:'no-store',headers:{Accept:'text/plain'}});
      if(!response.ok) throw new Error(`Mela build service returned ${response.status}`);
      const html = await response.text();
      const version = response.headers.get('x-mela-build') || 'unknown';
      if(!/^\s*<!doctype html>/i.test(html) || !/<title>\s*Mela/i.test(html)) {
        throw new Error(`Unexpected Mela build payload (${version})`);
      }
      document.open();
      document.write(html);
      document.close();
    }

    bootMela().catch(error=>{
      const root=document.getElementById('boot');
      root.innerHTML='<div class="mark">M</div><h1>Mela preview unavailable</h1><p class="error">The synchronized frontend could not be loaded.</p><p class="muted"></p>';
      root.querySelector('.muted').textContent=error instanceof Error?error.message:String(error);
      console.error('Mela bootstrap',error);
    });
  </script>
</body>
</html>
